services:
  portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_ASK_ALPHA: ${NEXT_PUBLIC_ASK_ALPHA:-true}
    image: shashank-portfolio
    container_name: shashank-portfolio
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_BIND:-127.0.0.1}:${PORTFOLIO_PORT:-4010}:3000"
